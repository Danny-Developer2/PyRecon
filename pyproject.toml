[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrecon"
version = "1.1.0"
description = "Herramienta profesional de reconocimiento de infraestructura de red en Python puro"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Juan Daniel Luevano Ruiz" }]
keywords = ["security", "pentesting", "reconnaissance", "network", "port-scanner"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "pydantic>=2.10,<3",
    "typer>=0.15,<1",
    "rich>=13.9,<14",
    "Jinja2>=3.1,<4",
    "dnspython>=2.7,<3",
    "reportlab>=4,<6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "pytest-mock>=3.14",
    "ruff>=0.9",
    "mypy>=1.15",
]

[project.scripts]
pyrecon = "pyrecon.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
# B008 es el idiom estándar de Typer (typer.Option como valor por defecto).
"src/pyrecon/cli.py" = ["B008"]
# E501: la plantilla HTML/CSS se escribe en líneas largas para facilitar su lectura.
"src/pyrecon/export/html_export.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers"
